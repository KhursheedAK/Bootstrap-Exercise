<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap 2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
      defer
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <div class="container">
      <h1 class="border border-success">Give me a green border</h1>
      <h1 class="border-bottom border-danger">Give me a red bottom border</h1>
      <h1 class="border border-warning rounded">
        Give me a rounded yellow border
      </h1>
      <h4 class="bg-danger text-white d-inline">
        red bg, white text, display inline
      </h4>
      <button class="btn btn-lg shadow-lg">
        Large Button With Large Shadow
      </button>
      <div class="shadow-sm p-3 my-5">
        Small shadow with padding(3) all around and margin(5) on top and bottom
      </div>
      <button
        class="btn btn-lg btn-outline-success p-0 p-sm-1 p-md-2 p-lg-3 p-xl-4"
      >
        I GROW
      </button>
      <h2 class="text-center d-none d-md-block">
        Center me, and make me hide at XS and SM
      </h2>
    </div>
  </body>
</html>
